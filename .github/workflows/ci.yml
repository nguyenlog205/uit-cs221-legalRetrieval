name: Legal RAG CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/checkout@v4 # Fix nhầm action, đúng ra là setup-python
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx pytest-mock fastapi pydantic uvicorn
          # Nếu ông có file requirements.txt thì dùng:
          # pip install -r requirements.txt
          # Đừng quên cài các thư viện agent của ông nữa

      - name: Run Pytest
        run: |
          python -m pytest tests/api_flow.py